name: Proxy Fork PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write
    
jobs:
  proxy-pr:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.base_ref }}

      - name: GitHub Actor
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.github.com

      - name: Capture PR info
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV

      - name: Create proxy branch
        run: |
          git checkout -b pr$PR_NUMBER origin/${{ github.base_ref }}

      - name: Fetch fork branch
        run: |
          git fetch ${{ github.event.pull_request.head.repo.clone_url }} \
            ${{ github.event.pull_request.head.ref }} --depth=100

      - name: Generate patches from fork
        run: |
          git format-patch origin/${{ github.base_ref }}..FETCH_HEAD -o /tmp/patches

      - name: Apply patches with original author
        run: |
          git am --committer-date-is-author-date --3way /tmp/patches/*.patch

      - name: Push proxy branch
        run: |
          git push origin pr$PR_NUMBER --force

      # A PR from the SAME fork branch triggers this workflow again on every
      # push (types: synchronize) — not just once. Without this check, every
      # follow-up commit the contributor pushes would try to open ANOTHER
      # proxy PR for a branch that already has one open, which the GitHub
      # API rejects (422) and fails the whole run. The branch itself is
      # always safe to re-push (force-push above already keeps it current);
      # only PR *creation* needs to happen exactly once.
      - name: Check for an existing proxy PR
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh api "repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:pr$PR_NUMBER&state=open" --jq '.[0].number // empty')
          echo "number=$number" >> $GITHUB_OUTPUT

      - name: Open new PR
        id: create-pr
        if: steps.existing.outputs.number == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=$(gh api repos/${{ github.repository }}/pulls \
            -f base=${{ github.base_ref }} \
            -f head=pr$PR_NUMBER \
            -f title="${{ github.event.pull_request.title}}" \
            -f body="## Auto-generated PR
          Original PR: #$PR_NUMBER
          Original Author: @$PR_AUTHOR

          ---

          ${{ github.event.pull_request.body }}" \
            --jq '.number')
          echo "NEW_PR_NUMBER=$pr_number" >> $GITHUB_ENV
          echo "NEW_PR_NUMBER=$pr_number" >> $GITHUB_OUTPUT

      - name: Add ready label
        if: steps.existing.outputs.number == '' && steps.create-pr.outputs.NEW_PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.create-pr.outputs.NEW_PR_NUMBER }}
        run: |
            gh pr edit $PR --add-label "proxied" --repo ${{ github.repository }}

      # Only comment/close on the run that actually created the proxy PR —
      # not on every later "synchronize" run, which would just spam the
      # same "PR was proxied" comment on every follow-up push.
      - name: Close original PR
        if: steps.existing.outputs.number == '' && steps.create-pr.outputs.NEW_PR_NUMBER != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment $PR_NUMBER --body "## PR was proxied and closed!
          See the new PR: #${{ steps.create-pr.outputs.NEW_PR_NUMBER }}
          Original Author: @$PR_AUTHOR
          Original PR: #$PR_NUMBER"
          gh pr close $PR_NUMBER