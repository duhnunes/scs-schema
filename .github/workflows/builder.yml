name: Build files

# Daily (and on demand): merges every PR labeled `validated` into master,
# then rebuilds everything on master itself. Like checker.yml, this only
# ever runs master's own code: PR schema files are read as data by
# scripts/ci/merge-prs.mjs and merged through the GitHub API.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge validated PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/merge-prs.mjs

      # Covers both the PRs merged above and anything committed straight
      # to master since the last run.
      - name: Bump versions and normalize schemas
        run: |
          node scripts/update.mjs
          node scripts/formatter.mjs
          node scripts/validate.mjs
          git add data/schemas
          git commit -m "ci(update): bump versions and normalize schemas [skip ci]" || echo "No changes to commit"

      # Build, phase 1: flatten schemas into data/dist/ and commit THAT
      # FIRST. The manifest's CDN URLs are pinned to a commit SHA, so they
      # must reference a commit where data/dist/ already exists.
      # -f: dist/ is in .gitignore so it's never committed from a
      # contributor's machine; only CI is meant to commit it.
      - name: Build data/dist
        id: dist
        run: |
          node scripts/build.mjs --dist-only
          git add -f data/dist
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data/dist/ unchanged"
          else
            git commit -m "ci(build): flatten schemas into data/dist [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Build, phase 2: the ref now contains data/dist/. Runs every time
      # (data/game-usage.json can change without dist/ changing); when
      # nothing changed, build.mjs keeps the old generatedAt, so the file
      # stays identical and nothing is committed.
      - name: Build manifest
        run: |
          node scripts/build.mjs --manifest-only "$(git rev-parse HEAD)"
          git add data/manifest.v3.json
          git commit -m "ci(build): update manifest URLs [skip ci]" || echo "No changes to commit"

      # Plain push, never rebase: rebasing would change the SHA the
      # manifest URLs are pinned to. If master moved meanwhile, this run
      # fails and the next one redoes everything on top of it.
      - name: Push
        run: git push origin HEAD:master
