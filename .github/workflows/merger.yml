name: Merger

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build files"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merger:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: List PRs with label ready
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          PRS=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls?state=open&per_page=100" \
          | jq -r '.[] | select(.labels | any(.name=="ready")) | .number' | tr '\n' ' ')
          echo "numbers=$PRS" >> $GITHUB_OUTPUT
      
      - name: Merge PRs with squash
        if: steps.prs.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for pr in ${{ steps.prs.outputs.numbers }}; do
            echo "Squash merge PR #$pr"

            # Calling the merge API directly (instead of the web UI) means
            # GitHub attributes the whole squash commit to whichever
            # token/actor made this API call — the original contributor
            # gets no credit (no green square) unless we add
            # Co-authored-by trailers ourselves. One trailer per unique
            # commit author on the PR, so every real contributor is
            # credited even if the PR has commits from more than one
            # person.
            TRAILERS=$(curl -s \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls/$pr/commits?per_page=250" \
              | jq -r '[.[] | "Co-authored-by: \(.commit.author.name) <\(.commit.author.email)>"] | unique | join("\n")')

            BODY=$(jq -n --arg msg "$TRAILERS" '{merge_method: "squash", commit_message: $msg}')

            curl -sS -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "$BODY" \
              https://api.github.com/repos/${REPO}/pulls/$pr/merge
          done