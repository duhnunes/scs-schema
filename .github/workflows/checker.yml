name: Schema checker

# pull_request_target (not pull_request) so fork PRs get a token that can
# label and comment. The price: this token belongs to the base repository,
# so this workflow must never run code from the PR. It checks out master,
# installs master's dependencies and runs master's scripts; the PR's
# schema files are only read as data by scripts/ci/check-pr.mjs.
# Never add a step that checks out or runs the PR's code here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: checker-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Check PR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/check-pr.mjs
